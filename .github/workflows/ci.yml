name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Native loader (zbNative.dll)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64 make
      - name: Build
        working-directory: c/windows
        run: make
      - uses: actions/upload-artifact@v7
        with:
          name: zbNative.dll
          path: c/windows/zbNative.dll
          if-no-files-found: error

  installer:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o ZombieBuddyInstaller.exe
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: ZombieBuddyInstaller.exe
          path: installer/ZombieBuddyInstaller.exe
          if-no-files-found: error

  java:
    # projectzomboid.jar is proprietary and can't be stored or downloaded here, so this job can only check the
    # Gradle setup. Compiling and the test suites run locally (see doc/Development.md).
    name: Java build setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      # Start Gradle with JDK 21, like a contributor without JDK 25; the toolchain resolver must provision 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure the build and provision JDK 25
        working-directory: java
        run: ./gradlew --no-daemon printToolchain
      - name: Report what was not checked
        run: |
          {
            echo "### Java: setup checked, compile and tests not run"
            echo "Compiling needs projectzomboid.jar, which can't be used in CI. Run locally before merging:"
            echo '```'
            echo "cd java && ./gradlew shadowJar unitTest test_vanilla test_patched"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
